metadata:
  name: "Ensure all resources have a required Owner tag"
  id: "CKV_XM_AWS_TAGS_3"
  category: "GENERAL_SECURITY"
  severity: "LOW"
  guideline: "https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html"
scope:
  provider: terraform
definition:
  and:
    - cond_type: attribute
      resource_types:
        - aws_instance
        - aws_s3_bucket
      attribute: "tags.Owner"
      operator: exists