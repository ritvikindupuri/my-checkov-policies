metadata:
  name: "Ensure S3 bucket has server-side encryption configured"
  id: "CKV_XM_AWS_S3_1"
  category: "ENCRYPTION"
scope:
  provider: terraform
definition:
  # Encryption can be declared two ways depending on the AWS provider version:
  #   - inline server_side_encryption_configuration block (provider v3 and earlier)
  #   - a separate aws_s3_bucket_server_side_encryption_configuration resource
  #     pointing at the bucket (provider v4+, the current idiom)
  # The connection condition is evaluated per bucket, so a bucket is only
  # satisfied by an encryption resource that targets that bucket.
  or:
    - cond_type: attribute
      resource_types:
        - aws_s3_bucket
      attribute: server_side_encryption_configuration
      operator: exists
    - cond_type: connection
      resource_types:
        - aws_s3_bucket
      connected_resource_types:
        - aws_s3_bucket_server_side_encryption_configuration
      operator: exists
