# Intentionally enforces strict equality to IMMUTABLE only.
# No other values (MUTABLE, MUTABLE_WITH_EXCLUSION, IMMUTABLE_WITH_EXCLUSION, or omitted) are accepted.
metadata:
  name: "Ensure ECR repository has image tag mutability set to IMMUTABLE"
  id: "CKV_XM_AWS_ECR_41"
  category: "GENERAL_SECURITY"
  severity: "HIGH"
scope:
  provider: terraform
definition:
  and:
    - cond_type: attribute
      resource_types:
        - aws_ecr_repository
      attribute: image_tag_mutability
      operator: equals
      value: "IMMUTABLE"
