# Intentionally requires encryption_configuration.encryption_type = "KMS".
# Repositories with encryption_type set to AES256, empty encryption blocks, or omitting
# encryption_configuration are rejected.
#
# Note on unresolved dynamic variables:
# In Checkov's directory runner (HCL), if encryption_type = var.something where the variable has
# no default value or tfvars supplied, Checkov cannot resolve the expression and silently drops
# the resource from the scan report rather than flagging it.
# To ensure enforcement when using dynamic variables, run Checkov against the compiled Terraform
# execution plan (tfplan.json), where Terraform resolves all variables and provider defaults.
metadata:
  name: "Ensure ECR repository has encryption configured with KMS"
  id: "CKV_XM_AWS_ECR_42"
  category: "ENCRYPTION"
  severity: "LOW"
  guideline: "https://docs.aws.amazon.com/AmazonECR/latest/userguide/encryption-at-rest.html"
scope:
  provider: terraform
definition:
  and:
    - cond_type: attribute
      resource_types:
        - aws_ecr_repository
      attribute: encryption_configuration.encryption_type
      operator: equals
      value: "KMS"
