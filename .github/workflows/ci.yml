name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # pull-requests: write is needed to post/update the failure comment.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create log directory
        run: mkdir -p ci-logs

      # Every gate below uses continue-on-error so that one failure does not hide the
      # others — a contributor sees every problem in one run. The "Report CI result"
      # step re-reads their outcomes and fails the job, so a red check still blocks.

      - name: Validate test fixtures
        id: fixtures
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            shopt -s globstar
            failed=0
            for yaml in checks/terraform/aws/**/*.yaml; do
              rel="${yaml#checks/terraform/aws/}"
              service="${rel%%/*}"
              check="${rel##*/}"
              check="${check%.yaml}"
              for dir in pass fail; do
                # Both the raw HCL and the plan JSON are required: each check is
                # exercised by the terraform runner and the terraform_plan runner.
                for fixture_file in main.tf tfplan.json; do
                  fixture="test/resources/terraform/${service}/${check}/${dir}/${fixture_file}"
                  if [[ ! -f "$fixture" ]]; then
                    echo "Missing fixture: $fixture"
                    failed=1
                  fi
                done
              done
            done
            exit $failed
          } 2>&1 | tee ci-logs/fixtures.log

      - name: Terraform IaC Scan
        id: iac
        continue-on-error: true
        run: |
          set -o pipefail
          # test/ is excluded because it contains intentionally non-compliant Terraform
          # fixtures (fail/) used only for testing custom checks — not real infrastructure.
          # Scanning it would produce expected failures that are not actionable.
          checkov -d . --framework terraform --skip-path test --quiet 2>&1 | tee ci-logs/iac.log

      - name: Secrets Scan
        id: secrets
        continue-on-error: true
        run: |
          set -o pipefail
          # test/ is excluded because it contains mock AWS credentials used as test
          # fixtures to satisfy the Terraform provider block — not real secrets.
          # Scanning it would produce false positives.
          checkov -d . --framework secrets --skip-path test --quiet 2>&1 | tee ci-logs/secrets.log

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -v --tb=short 2>&1 | tee ci-logs/pytest.log

      - name: Build comment body
        id: report
        if: always() && github.event_name == 'pull_request'
        env:
          FIXTURES: ${{ steps.fixtures.outcome }}
          IAC: ${{ steps.iac.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          FENCE='```text'
          failures=0

          : > sections.md

          emit_section() {
            local outcome="$1" title="$2" log="$3"
            if [[ "$outcome" != "failure" ]]; then
              return 0
            fi
            failures=$((failures + 1))
            {
              echo
              echo "<details open>"
              echo "<summary><strong>${title}</strong></summary>"
              echo
              echo "$FENCE"
              # Tail rather than head: the actionable summary sits at the end of both
              # checkov and pytest output. Also keeps the comment under GitHub's limit.
              if [[ -s "$log" ]]; then
                tail -c 6000 "$log"
              else
                echo "(no output captured)"
              fi
              echo '```'
              echo
              echo "</details>"
            } >> sections.md
          }

          emit_section "$FIXTURES" "Fixture validation" ci-logs/fixtures.log
          emit_section "$IAC"      "Terraform IaC scan" ci-logs/iac.log
          emit_section "$SECRETS"  "Secrets scan"       ci-logs/secrets.log
          emit_section "$PYTEST"   "Tests (pytest)"     ci-logs/pytest.log

          if [[ "$failures" -gt 0 ]]; then
            {
              echo "<!-- ci-failure-report -->"
              echo "## CI failed — ${failures} gate(s) need attention"
              echo
              echo "Commit \`${SHORT_SHA}\`. Fix the items below and push again; this comment"
              echo "updates itself on every run. No need to request a review until CI is green."
              cat sections.md
              echo
              echo "[View the full run log](${RUN_URL})"
            } > comment.md
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "<!-- ci-failure-report -->"
              echo "## CI passed"
              echo
              echo "All gates green on \`${SHORT_SHA}\`. Ready for review."
              echo
              echo "[View the full run log](${RUN_URL})"
            } > comment.md
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error so that a missing-permission error (for example on a PR from
      # a fork, where the token is read-only) cannot mask the real CI result.
      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          HAS_FAILURES: ${{ steps.report.outputs.has_failures }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-failure-report -->';
            const body = fs.readFileSync('comment.md', 'utf8');
            const hasFailures = process.env.HAS_FAILURES === 'true';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              // Edit in place so the timeline keeps one comment, not one per push.
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.id}`);
            } else if (hasFailures) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created failure comment');
            } else {
              // Nothing failed and there is no stale comment to clear.
              core.info('CI passed with no prior failure comment — nothing to post.');
            }

      - name: Report CI result
        if: always()
        env:
          FIXTURES: ${{ steps.fixtures.outcome }}
          IAC: ${{ steps.iac.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          set -uo pipefail
          failed=0
          for gate in "Fixture validation|$FIXTURES" "Terraform IaC scan|$IAC" "Secrets scan|$SECRETS" "Tests|$PYTEST"; do
            name="${gate%|*}"
            outcome="${gate##*|}"
            printf '%-20s %s\n' "$name" "$outcome"
            if [[ "$outcome" == "failure" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -eq 1 ]]; then
            echo "::error::One or more CI gates failed — see the step logs above and the PR comment."
            exit 1
          fi
          echo "All CI gates passed."
