name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate test fixtures
        if: github.event_name == 'pull_request'
        run: |
          shopt -s globstar
          failed=0
          for yaml in checks/terraform/aws/**/*.yaml; do
            rel="${yaml#checks/terraform/aws/}"
            service="${rel%%/*}"
            check="${rel##*/}"
            check="${check%.yaml}"
            for dir in pass fail; do
              fixture="test/resources/terraform/${service}/${check}/${dir}/main.tf"
              if [[ ! -f "$fixture" ]]; then
                echo "Missing fixture: $fixture"
                failed=1
              fi
            done
          done
          exit $failed

      - name: Terraform IaC Scan
        run: |
          # test/ is excluded because it contains intentionally non-compliant Terraform
          # fixtures (fail/) used only for testing custom checks — not real infrastructure.
          # Scanning it would produce expected failures that are not actionable.
          checkov -d . --framework terraform --skip-path test --quiet

      - name: Secrets Scan
        run: |
          # test/ is excluded because it contains mock AWS credentials used as test
          # fixtures to satisfy the Terraform provider block — not real secrets.
          # Scanning it would produce false positives.
          checkov -d . --framework secrets --skip-path test --quiet

      - name: Run tests
        run: pytest -v --tb=short
